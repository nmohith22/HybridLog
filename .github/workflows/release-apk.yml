name: Publish HybridLog APK release

on:
  push:
    branches: [main]
    paths:
      - "release/HybridLog-*.apk"
  pull_request:
    branches: [main]
    paths:
      - "lib/**"
      - "test/**"
      - "evals/**"
      - "tool/**"
      - "android/app/src/main/cpp/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/release-apk.yml"

permissions: {}

concurrency:
  group: hybridlog-apk-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.1"
          cache: true
      - name: Resolve Flutter packages
        run: flutter pub get
      - name: Run Flutter unit and widget tests
        env:
          TZ: America/Chicago
        run: flutter test --reporter expanded
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: evals/requirements.txt
      - name: Install offline evaluation tools
        run: python -m pip install -r evals/requirements.txt
      - name: Run Steel policy evaluation with pytest and Ragas
        env:
          RAGAS_DO_NOT_TRACK: "true"
        run: pytest -q evals

  publish:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish each new APK version
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_SHA: ${{ github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          mapfile -t apks < <(git diff --name-only --diff-filter=AMR "$BEFORE_SHA" "$PUSH_SHA" -- 'release/HybridLog-*.apk')
          if (( ${#apks[@]} == 0 )); then
            echo "No versioned HybridLog APK was changed in this commit."
            exit 0
          fi

          commit_message="$(git log -1 --format=%s "$PUSH_SHA")"
          for apk in "${apks[@]}"; do
            filename="${apk##*/}"
            version="${filename#HybridLog-}"
            version="${version%.apk}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "APK filename must use HybridLog-major.minor.patch.apk: $filename" >&2
              exit 1
            fi

            tag="v$version"
            notes_file="$(mktemp)"
            printf -- '- %s\n' "$commit_message" > "$notes_file"
            if gh release view "$tag" >/dev/null 2>&1; then
              if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$filename"; then
                echo "Release $tag already contains $filename."
              else
                gh release upload "$tag" "$apk"
              fi
            else
              gh release create "$tag" "$apk" --title "HybridLog $version" --notes-file "$notes_file" --target "$PUSH_SHA"
            fi
            rm -f "$notes_file"
          done
      - name: Update README download link
        run: |
          latest_apk="$(find release -maxdepth 1 -type f -name 'HybridLog-*.apk' -printf '%f\n' | sort -V | tail -n 1)"
          version="${latest_apk#HybridLog-}"
          version="${version%.apk}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Could not determine the latest versioned APK." >&2
            exit 1
          fi

          python3 - "$version" <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          pattern = r"\*\*\[Download HybridLog \d+\.\d+\.\d+ for Android\]\(https://github\.com/nmohith22/HybridLog/releases/download/v\d+\.\d+\.\d+/HybridLog-\d+\.\d+\.\d+\.apk\)\*\*"
          link = f"**[Download HybridLog {version} for Android](https://github.com/nmohith22/HybridLog/releases/download/v{version}/HybridLog-{version}.apk)**"
          updated, count = re.subn(pattern, link, text, count=1)
          if count != 1:
              raise SystemExit("Expected exactly one versioned APK download link in README.md")
          readme.write_text(updated, encoding="utf-8")
          PY

          if git diff --quiet -- README.md; then
            echo "README download link already targets HybridLog $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README download to $version"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
