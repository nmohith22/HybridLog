name: workout_app
description: A quiet luxury fitness tracking app.
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  share_plus: ^10.1.0
  file_picker: ^8.1.0
  http: ^1.2.1
  home_widget: ^0.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  isar_generator: ^3.1.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FAFAFA"
  color_dark: "#121212"
  image: "assets/splash_icon.png"
  image_dark: "assets/splash_icon_dark.png"
  android_12:
    image: "assets/splash_icon.png"
    image_dark: "assets/splash_icon_dark.png"
    color: "#FAFAFA"
    color_dark: "#121212"
  android: true
  ios: true